<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로그램 — 한국문화기획학교</title>
<meta name="description" content="한국문화기획학교가 진행하는 교육, 살롱, 컨설팅 프로그램을 소개합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="programs">

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero ambient">
    <div class="page-hero-ambient-bg" aria-hidden="true"><span class="blob-1"></span><span class="blob-2"></span></div>
    <div class="wrap">
      <p class="eyebrow">프로그램</p>
      <h1>교육 프로그램, 문화 프로젝트</h1>
      <p class="lede">문화기획자를 위한 교육과정부터 지자체·기관과 함께하는 컨설팅·축제기획·공간운영까지, 한국문화기획학교가 운영하는 프로그램입니다. 카테고리는 계속 늘어날 예정입니다.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap" id="programGroups">
      <p>프로그램을 불러오는 중입니다…</p>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const data = await loadJSON('/content/data/programs.json');
  const host = document.getElementById('programGroups');
  if(!data || !data.items || !data.items.length){
    host.innerHTML = `<div class="empty-note">아직 등록된 프로그램이 없습니다. 관리자 페이지(/admin)에서 새 프로그램을 추가해 주세요.</div>`;
    return;
  }
  const preferredOrder = ['교육 프로그램', '문화 프로젝트'];
  const groups = {};
  const order = [];
  data.items.forEach(p => {
    const key = p.category || '프로그램';
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(p);
  });
  order.sort((a,b) => {
    const ia = preferredOrder.indexOf(a), ib = preferredOrder.indexOf(b);
    if(ia === -1 && ib === -1) return 0;
    if(ia === -1) return 1;
    if(ib === -1) return -1;
    return ia - ib;
  });
  host.innerHTML = order.map(key => {
    const meta = categoryMeta(key);
    return `
      <div class="program-group" id="${encodeURIComponent(key)}" style="margin-bottom:52px;">
        <div class="category-banner" style="background:linear-gradient(120deg, ${meta.color}, ${meta.color}cc);">
          <div>
            <span class="cb-sub">CATEGORY</span>
            <h2>${escapeHTML(meta.label)}</h2>
          </div>
          <span class="cb-count">${groups[key].length}개 프로그램</span>
        </div>
        <div class="card-grid">${groups[key].map(renderProgramCard).join('')}</div>
      </div>
    `;
  }).join('');
});
</script>
</body>
</html>
