<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로그램 — 한국문화기획학교</title>
<meta name="description" content="한국문화기획학교가 진행하는 교육, 살롱, 컨설팅 프로그램을 소개합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="programs">

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero ambient">
    <div class="page-hero-ambient-bg" aria-hidden="true"><span class="blob-1"></span><span class="blob-2"></span></div>
    <div class="wrap">
      <p class="eyebrow">프로그램</p>
      <h1>교육 프로그램, 문화 프로젝트</h1>
      <p class="lede">문화기획자를 위한 교육과정부터 지자체·기관과 함께하는 컨설팅·축제기획·공간운영까지, 한국문화기획학교가 운영하는 프로그램입니다. 카테고리는 계속 늘어날 예정입니다.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div id="indexTabs" class="index-tabs"></div>
      <div id="indexPanel" class="index-panel">
        <p>프로그램을 불러오는 중입니다…</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="/js/main.js"></script>
<script>
let PROGRAM_DATA = null;
let ACTIVE_CATEGORY = null;
let ACTIVE_SUB = '전체';

function buildCategoryOrder(items){
  const preferredOrder = ['교육 프로그램', '문화 프로젝트'];
  const seen = [];
  items.forEach(p => { const k = p.category || '프로그램'; if(!seen.includes(k)) seen.push(k); });
  seen.sort((a,b) => {
    const ia = preferredOrder.indexOf(a), ib = preferredOrder.indexOf(b);
    if(ia === -1 && ib === -1) return 0;
    if(ia === -1) return 1;
    if(ib === -1) return -1;
    return ia - ib;
  });
  return seen;
}

function renderTabs(){
  const items = PROGRAM_DATA.items;
  const order = buildCategoryOrder(items);
  const tabsHost = document.getElementById('indexTabs');
  tabsHost.innerHTML = order.map(key => {
    const meta = categoryMeta(key);
    const count = items.filter(p => (p.category||'프로그램') === key).length;
    const active = key === ACTIVE_CATEGORY;
    return `
      <button type="button" class="index-tab ${active ? 'active' : ''}" data-cat="${escapeHTML(key)}"
        style="background:${meta.color};">
        ${escapeHTML(key)} <span class="it-count">${count}</span>
      </button>
    `;
  }).join('');
  tabsHost.querySelectorAll('.index-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      ACTIVE_CATEGORY = btn.getAttribute('data-cat');
      ACTIVE_SUB = '전체';
      renderTabs();
      renderPanel();
    });
  });
}

function renderPanel(){
  const items = PROGRAM_DATA.items.filter(p => (p.category||'프로그램') === ACTIVE_CATEGORY);
  const meta = categoryMeta(ACTIVE_CATEGORY);
  const panel = document.getElementById('indexPanel');

  const subOrder = [];
  const subGroups = {};
  items.forEach(p => {
    const s = p.tag || '기타';
    if(!subGroups[s]){ subGroups[s] = []; subOrder.push(s); }
    subGroups[s].push(p);
  });

  const subTabsHtml = `
    <button type="button" class="subtab ${ACTIVE_SUB === '전체' ? 'active' : ''}" data-sub="전체" style="--sub-color:${meta.color};">
      전체 <span class="count">${items.length}</span>
    </button>
  ` + subOrder.map(s => `
    <button type="button" class="subtab ${ACTIVE_SUB === s ? 'active' : ''}" data-sub="${escapeHTML(s)}" style="--sub-color:${meta.color};">
      ${escapeHTML(s)} <span class="count">${subGroups[s].length}</span>
    </button>
  `).join('');

  const bodyHtml = ACTIVE_SUB === '전체'
    ? subOrder.map(s => `
        <div class="subcategory-block">
          <div class="subcategory-head" style="border-color:${meta.color};">
            <span class="sc-dot" style="background:${meta.color};"></span>
            <h3>${escapeHTML(s)}</h3>
            <span class="sc-count">${subGroups[s].length}</span>
          </div>
          <div class="card-grid">${subGroups[s].map(renderProgramCard).join('')}</div>
        </div>
      `).join('')
    : `<div class="card-grid">${(subGroups[ACTIVE_SUB]||[]).map(renderProgramCard).join('')}</div>`;

  panel.style.borderTopColor = meta.color;
  panel.innerHTML = `
    <div class="subtab-row">${subTabsHtml}</div>
    ${bodyHtml}
  `;
  panel.querySelectorAll('.subtab').forEach(btn => {
    btn.addEventListener('click', () => {
      ACTIVE_SUB = btn.getAttribute('data-sub');
      renderPanel();
    });
  });
}

document.addEventListener('DOMContentLoaded', async () => {
  const data = await loadJSON('/content/data/programs.json');
  const panel = document.getElementById('indexPanel');
  if(!data || !data.items || !data.items.length){
    document.getElementById('indexTabs').style.display = 'none';
    panel.innerHTML = `<div class="empty-note">아직 등록된 프로그램이 없습니다.</div>`;
    return;
  }
  PROGRAM_DATA = data;
  const order = buildCategoryOrder(data.items);
  const params = new URLSearchParams(window.location.search);
  const requested = params.get('cat');
  ACTIVE_CATEGORY = (requested && order.includes(requested)) ? requested : order[0];
  renderTabs();
  renderPanel();
});
</script>
</body>
</html>
