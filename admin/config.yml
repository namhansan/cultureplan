backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "programs"
    label: "프로그램"
    files:
      - file: "content/data/programs.json"
        label: "프로그램 목록"
        name: "programs"
        fields:
          - label: "프로그램 목록"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - label: "고유 주소 (영문/숫자, 공백 없이. 예: salon-tomorrow)"
                name: "slug"
                widget: "string"
                required: false
                hint: "내부 상세페이지 주소로 사용됩니다. 외부 링크 프로그램이면 비워두고 아래 '외부 링크'를 채워주세요."
              - label: "제목"
                name: "title"
                widget: "string"
              - label: "분류 (카테고리 — 새 카테고리는 그냥 새로운 이름을 입력하면 자동으로 생깁니다)"
                name: "category"
                widget: "string"
                hint: "예: 교육 프로그램, 문화 프로젝트. 지금 없는 이름을 입력하면 프로그램 페이지에 새 그룹으로 자동 생성됩니다."
                default: "문화 프로젝트"
              - label: "하위 태그 (선택, 카드에 작게 표시됨)"
                name: "tag"
                widget: "string"
                required: false
                hint: "예: 컨설팅 / 축제기획 / 공간운영 / 내일의 축제학교"
              - label: "상태 (예: 정기 모집 / 모집 예정 / 상시 운영)"
                name: "status"
                widget: "string"
              - label: "소개 (카드에 짧게 보이는 문구)"
                name: "summary"
                widget: "text"
              - label: "운영 시기"
                name: "period"
                widget: "string"
                required: false
              - label: "대상"
                name: "audience"
                widget: "string"
                required: false
              - label: "포스터·대표 이미지 (선택)"
                name: "image"
                widget: "image"
                required: false
                hint: "업로드하면 상세페이지 상단에 크게 표시됩니다. 비워두면 분류 색상 배너가 대신 표시됩니다."
              - label: "상세 내용 (내부 상세페이지 본문. 외부 링크 프로그램이면 비워두세요)"
                name: "detail"
                widget: "text"
                required: false
              - label: "외부 링크 (한국축제지원센터처럼 다른 사이트로 보낼 때만 입력)"
                name: "externalUrl"
                widget: "string"
                required: false
                hint: "입력하면 카드가 이 주소로 바로 연결되고, 상세 내용은 무시됩니다."

  - name: "news"
    label: "소식"
    files:
      - file: "content/data/news.json"
        label: "소식 목록"
        name: "news"
        fields:
          - label: "소식 목록"
            name: "items"
            widget: "list"
            summary: "{{date}} — {{title}}"
            fields:
              - label: "날짜"
                name: "date"
                widget: "date"
                format: "YYYY-MM-DD"
              - label: "분류 (예: 운영안내 / 모집 / 소식 / 공시)"
                name: "tag"
                widget: "string"
              - label: "제목"
                name: "title"
                widget: "string"
              - label: "내용"
                name: "body"
                widget: "text"
                required: false
              - label: "링크 URL (선택)"
                name: "link"
                widget: "string"
                required: false
                hint: "외부 링크가 있으면 입력 (예: 홈택스 조회 페이지)"
              - label: "링크 버튼 이름 (선택)"
                name: "linkLabel"
                widget: "string"
                required: false
                hint: "예: 국세청 홈택스 바로가기"

  - name: "network"
    label: "네트워크"
    files:
      - file: "content/data/network.json"
        label: "네트워크 (운영시설·기관 / 협력문화기업)"
        name: "network"
        fields:
          - label: "운영시설 및 기관"
            name: "facility"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "기관명", name: "name", widget: "string" }
              - { label: "짧은 소개 (한 줄)", name: "tagline", widget: "string", required: false }
              - { label: "설명", name: "description", widget: "text" }
              - { label: "웹사이트 주소", name: "url", widget: "string", required: false }
          - label: "협력문화기업"
            name: "company"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "기업명", name: "name", widget: "string" }
              - { label: "로고/이미지 (선택)", name: "image", widget: "image", required: false }
              - { label: "짧은 소개 (한 줄)", name: "tagline", widget: "string", required: false }
              - { label: "설명", name: "description", widget: "text" }
              - { label: "웹사이트 주소", name: "url", widget: "string", required: false }

  - name: "community"
    label: "커뮤니티"
    files:
      - file: "content/data/community.json"
        label: "커뮤니티 목록"
        name: "community"
        fields:
          - label: "커뮤니티 목록 (새 항목 추가 가능)"
            name: "items"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "이름", name: "name", widget: "string" }
              - { label: "대표 이미지 (선택)", name: "image", widget: "image", required: false }
              - { label: "배지 문구 (예: 격월 운영, 2014~2025 · 12년 연속)", name: "badge", widget: "string", required: false }
              - { label: "짧은 소개", name: "tagline", widget: "string", required: false }
              - { label: "설명", name: "description", widget: "text" }
              - { label: "살롱, 낯선 아카이브로 연결할지 여부", name: "hasArchive", widget: "boolean", default: false, hint: "켜두면 카드에 '아카이브 전체 보기' 링크가 붙습니다." }

  - name: "salon-archive"
    label: "살롱, 낯선 아카이브"
    files:
      - file: "content/data/salon-archive.json"
        label: "살롱, 낯선 회차 목록"
        name: "archive"
        fields:
          - label: "회차 목록 (새 회차가 열리면 여기에 추가하세요)"
            name: "items"
            widget: "list"
            summary: "{{date}} — {{title}}"
            fields:
              - { label: "날짜", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - { label: "제목/주제", name: "title", widget: "string" }
              - { label: "포스터 이미지", name: "poster", widget: "image", required: false }
              - { label: "설명", name: "desc", widget: "text", required: false }
              - { label: "강연자 정보", name: "speaker", widget: "text", required: false }
              - { label: "장소", name: "location", widget: "string", required: false }

  - name: "members-config"
    label: "회원 전용 접속 코드"
    files:
      - file: "content/data/members-config.json"
        label: "접속 코드 설정"
        name: "config"
        fields:
          - label: "접속 코드"
            name: "passcode"
            widget: "string"
            hint: "회원 전용 페이지(/members.html)에 들어올 때 회원들이 입력할 공용 비밀번호입니다. 여기서 바꾸면 바로 반영돼요."

  - name: "member-resources"
    label: "회원 전용 자료"
    files:
      - file: "content/data/member-resources.json"
        label: "회원 전용 자료 목록"
        name: "resources"
        fields:
          - label: "자료 목록"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - label: "날짜"
                name: "date"
                widget: "date"
                format: "YYYY-MM-DD"
              - label: "제목"
                name: "title"
                widget: "string"
              - label: "설명"
                name: "description"
                widget: "text"
                required: false
              - label: "첨부 파일 (PDF 등, 선택)"
                name: "fileUrl"
                widget: "file"
                required: false
              - label: "영상 링크 (유튜브 등, 선택)"
                name: "videoUrl"
                widget: "string"
                required: false

  - name: "finance"
    label: "재무제표"
    files:
      - file: "content/data/finance.json"
        label: "재무제표 목록"
        name: "finance"
        fields:
          - label: "재무제표 목록"
            name: "items"
            widget: "list"
            summary: "{{year}} — {{title}}"
            fields:
              - label: "연도"
                name: "year"
                widget: "string"
              - label: "문서명"
                name: "title"
                widget: "string"
              - label: "PDF 파일"
                name: "fileUrl"
                widget: "file"
                required: false
                hint: "PDF를 업로드하면 자동으로 경로가 채워집니다."

  - name: "donations"
    label: "기부금 내역"
    files:
      - file: "content/data/donations.json"
        label: "기부금 내역"
        name: "donations"
        fields:
          - label: "기부금 목록"
            name: "items"
            widget: "list"
            summary: "{{year}} — {{name}}"
            fields:
              - label: "연도"
                name: "year"
                widget: "string"
              - label: "후원자 (익명 가능)"
                name: "name"
                widget: "string"
              - label: "금액"
                name: "amount"
                widget: "string"
              - label: "사용 목적"
                name: "purpose"
                widget: "string"
                required: false
