<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네트워크 — 한국문화기획학교</title>
<meta name="description" content="한국문화기획학교의 운영시설·기관과 협력문화기업 네트워크를 소개합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="network">

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero ambient">
    <div class="page-hero-ambient-bg" aria-hidden="true"><span class="blob-1"></span><span class="blob-2"></span></div>
    <div class="wrap">
      <p class="eyebrow">네트워크</p>
      <h1>함께 연결된 기관과 기업</h1>
      <p class="lede">한국문화기획학교가 직접 운영하는 시설·기관과, 함께 문화기획 생태계를 만들어가는 협력문화기업 네트워크입니다.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div id="indexTabs" class="index-tabs"></div>
      <div id="indexPanel" class="index-panel">
        <p>불러오는 중입니다…</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="/js/main.js"></script>
<script>
let NETWORK_ITEMS = [];
let ACTIVE_NET_CAT = null;

function buildNetworkCategoryOrder(items){
  const preferredOrder = ['운영시설 및 기관', '협력문화기업'];
  const seen = [];
  items.forEach(p => { const k = p.category || '네트워크'; if(!seen.includes(k)) seen.push(k); });
  seen.sort((a,b) => {
    const ia = preferredOrder.indexOf(a), ib = preferredOrder.indexOf(b);
    if(ia === -1 && ib === -1) return 0;
    if(ia === -1) return 1;
    if(ib === -1) return -1;
    return ia - ib;
  });
  return seen;
}

function renderNetworkCard(p){
  const color = hashColor(p.category || 'network');
  const media = p.image
    ? `<div class="cc-media" style="background-image:url('${encodeURI(p.image)}'); background-size:cover; background-position:center;"></div>`
    : `<div class="cc-media" style="background:linear-gradient(135deg, ${color}, ${color}cc);">${escapeHTML((p.name||'').slice(0,1))}</div>`;
  const inner = `
    ${media}
    <div class="cc-body">
      <span class="cc-tag" style="color:${color}; border-color:${color};">${escapeHTML(p.tagline || p.category || '')}</span>
      <h3>${escapeHTML(p.name || '')}</h3>
      <p>${escapeHTML(p.description || '')}</p>
      ${p.url ? `<span class="cc-link">방문하기 ↗</span>` : ''}
    </div>
  `;
  return p.url
    ? `<a class="company-card" href="${encodeURI(p.url)}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="company-card">${inner}</div>`;
}

function renderNetworkTabs(){
  const order = buildNetworkCategoryOrder(NETWORK_ITEMS);
  const host = document.getElementById('indexTabs');
  host.innerHTML = order.map(key => {
    const meta = categoryMeta(key);
    const count = NETWORK_ITEMS.filter(p => (p.category||'네트워크') === key).length;
    return `
      <button type="button" class="index-tab ${key === ACTIVE_NET_CAT ? 'active' : ''}" data-cat="${escapeHTML(key)}" style="background:${meta.color};">
        ${escapeHTML(key)} <span class="it-count">${count}</span>
      </button>
    `;
  }).join('');
  host.querySelectorAll('.index-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      ACTIVE_NET_CAT = btn.getAttribute('data-cat');
      renderNetworkTabs();
      renderNetworkPanel();
    });
  });
}

function renderNetworkPanel(){
  const panel = document.getElementById('indexPanel');
  const meta = categoryMeta(ACTIVE_NET_CAT);
  panel.style.borderTopColor = meta.color;
  const list = NETWORK_ITEMS.filter(p => (p.category||'네트워크') === ACTIVE_NET_CAT);
  panel.innerHTML = list.length
    ? `<div class="card-grid">${list.map(renderNetworkCard).join('')}</div>`
    : `<div class="empty-note">등록된 항목이 없습니다.</div>`;
}

document.addEventListener('DOMContentLoaded', async () => {
  const data = await loadJSON('/content/data/network.json');
  const panel = document.getElementById('indexPanel');
  NETWORK_ITEMS = (data && data.items) || [];
  if(!NETWORK_ITEMS.length){
    document.getElementById('indexTabs').style.display = 'none';
    panel.innerHTML = `<div class="empty-note">아직 등록된 네트워크가 없습니다.</div>`;
    return;
  }
  const order = buildNetworkCategoryOrder(NETWORK_ITEMS);
  const params = new URLSearchParams(window.location.search);
  const requested = params.get('tab');
  ACTIVE_NET_CAT = (requested && order.includes(requested)) ? requested : order[0];
  renderNetworkTabs();
  renderNetworkPanel();
});
</script>
</body>
</html>
