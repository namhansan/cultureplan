<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커뮤니티 — 한국문화기획학교</title>
<meta name="description" content="살롱 낯선, 살롱 내일, 회원스터디 등 한국문화기획학교의 커뮤니티를 소개합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/style.css">
<style>
  #communityList{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
  @media (max-width:900px){ #communityList{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:620px){ #communityList{ grid-template-columns:1fr; } }
</style>
</head>
<body data-page="community">

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero ambient">
    <div class="page-hero-ambient-bg" aria-hidden="true"><span class="blob-1"></span><span class="blob-2"></span></div>
    <div class="wrap">
      <p class="eyebrow">커뮤니티</p>
      <h1>배우고, 나누고, 연결됩니다</h1>
      <p class="lede">한국문화기획학교는 정보를 전달하는 곳을 넘어, 문화기획자들이 실제로 만나고 네트워킹하는 커뮤니티입니다.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div id="communityList">
        <p>불러오는 중입니다…</p>
      </div>
    </div>
  </section>

  <div id="archiveSections"></div>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="/js/main.js"></script>
<script>
const ARCHIVE_FILES = {
  'salon-narseon': { title: '살롱, 낯선 아카이브', file: '/content/data/salon-archive.json' },
  'salon-tomorrow': { title: '살롱, 내일 아카이브', file: '/content/data/archive-salon-tomorrow.json' },
  'member-study': { title: '회원스터디 아카이브', file: '/content/data/archive-member-study.json' }
};

function renderArchiveEntries(host, list){
  if(!list.length){
    host.innerHTML = `<div class="empty-note">아직 등록된 회차가 없습니다.</div>`;
    return;
  }
  host.innerHTML = list.map(e => `
    <details class="archive-card">
      <summary>
        ${e.poster ? `<img class="ac-poster" src="${encodeURI(e.poster)}" alt="${escapeHTML(e.title||'')}" loading="lazy">` : ''}
        <div class="ac-body">
          <span class="a-date">${escapeHTML(e.date||'')}</span>
          <h3>${escapeHTML((e.title||'').replace(/[""]/g,''))}</h3>
          <span class="a-more">자세히 보기 →</span>
        </div>
      </summary>
      <div class="ac-body a-expand">
        ${e.desc ? `<p>${escapeHTML(e.desc)}</p>` : ''}
        ${e.speaker ? `<p class="a-speaker">${escapeHTML(e.speaker)}</p>` : ''}
        ${e.location ? `<div class="a-loc">${escapeHTML(e.location)}</div>` : ''}
      </div>
    </details>
  `).join('');
}

document.addEventListener('DOMContentLoaded', async () => {
  const communityData = await loadJSON('/content/data/community.json');
  const communityHost = document.getElementById('communityList');
  const sectionsHost = document.getElementById('archiveSections');
  const items = (communityData && communityData.items) || [];

  communityHost.innerHTML = items.length ? items.map(c => {
    const color = hashColor(c.name || 'community');
    const media = c.image
      ? `<div class="ticket-media" style="background-image:url('${encodeURI(c.image)}');"></div>`
      : `<div class="ticket-media ticket-media-fallback" style="background:linear-gradient(135deg, ${color}, ${color}cc);"><span>${escapeHTML(c.name||'')}</span></div>`;
    const hasArchive = c.archiveKey && ARCHIVE_FILES[c.archiveKey];
    const inner = `
      ${media}
      <div class="ticket-body">
        <span class="cat-chip" style="color:${color}; border-color:${color};">커뮤니티</span>
        <div class="status">${escapeHTML(c.badge||'')}</div>
        <h3>${escapeHTML(c.name||'')}</h3>
        <p>${escapeHTML(c.description||'')}</p>
        ${hasArchive ? `<div class="meta">아카이브 보기 <span class="arrow">↓</span></div>` : ''}
      </div>
    `;
    return hasArchive
      ? `<a class="ticket" href="#archive-${c.archiveKey}">${inner}</a>`
      : `<div class="ticket">${inner}</div>`;
  }).join('') : `<div class="empty-note">아직 등록된 커뮤니티가 없습니다.</div>`;

  // Render one archive section per community item that has an archiveKey, in the same order
  const withArchive = items.filter(c => c.archiveKey && ARCHIVE_FILES[c.archiveKey]);
  sectionsHost.innerHTML = withArchive.map((c, i) => {
    const meta = ARCHIVE_FILES[c.archiveKey];
    return `
      <section class="section ${i % 2 === 0 ? 'alt' : ''}" id="archive-${c.archiveKey}">
        <div class="wrap">
          <div class="section-head" style="margin-bottom:20px;">
            <p class="eyebrow">${escapeHTML(c.name)}</p>
            <h2>${escapeHTML(meta.title)}</h2>
            <p>최신 회차부터 순서대로 보여드립니다. 포스터를 눌러 상세 내용을 펼쳐보세요.</p>
          </div>
          <input type="text" class="archive-search-input" data-archive="${c.archiveKey}" placeholder="주제, 강연자로 검색">
          <div id="archiveGrid-${c.archiveKey}" class="archive-grid">
            <p>불러오는 중입니다…</p>
          </div>
        </div>
      </section>
    `;
  }).join('');

  for(const c of withArchive){
    const meta = ARCHIVE_FILES[c.archiveKey];
    const data = await loadJSON(meta.file);
    const grid = document.getElementById(`archiveGrid-${c.archiveKey}`);
    const entries = ((data && data.items) || []).slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));
    renderArchiveEntries(grid, entries);

    const searchInput = document.querySelector(`.archive-search-input[data-archive="${c.archiveKey}"]`);
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      if(!q){ renderArchiveEntries(grid, entries); return; }
      renderArchiveEntries(grid, entries.filter(e =>
        (e.title||'').toLowerCase().includes(q) ||
        (e.speaker||'').toLowerCase().includes(q) ||
        (e.desc||'').toLowerCase().includes(q)
      ));
    });
  }
});
</script>
</body>
</html>
