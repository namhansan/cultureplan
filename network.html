<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네트워크 — 한국문화기획학교</title>
<meta name="description" content="한국문화기획학교의 운영시설·기관과 협력문화기업 네트워크를 소개합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="network">

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero ambient">
    <div class="page-hero-ambient-bg" aria-hidden="true"><span class="blob-1"></span><span class="blob-2"></span></div>
    <div class="wrap">
      <p class="eyebrow">네트워크</p>
      <h1>함께 연결된 기관과 기업</h1>
      <p class="lede">한국문화기획학교가 직접 운영하는 시설·기관과, 함께 문화기획 생태계를 만들어가는 협력문화기업 네트워크입니다.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div id="indexTabs" class="index-tabs"></div>
      <div id="indexPanel" class="index-panel">
        <p>불러오는 중입니다…</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="/js/main.js"></script>
<script>
const NETWORK_TABS = [
  { key: 'facility', label: '운영시설 및 기관', color: '#1F5C43' },
  { key: 'company',  label: '협력문화기업',   color: '#B23A33' }
];
let NETWORK_DATA = null;
let ACTIVE_NET_TAB = 'facility';

function renderFacilityList(list){
  return list.length ? `<div style="display:flex; flex-direction:column; gap:20px;">${list.map(p => `
    <div class="partner-card">
      <div>
        <p class="eyebrow">${escapeHTML(p.tagline || '운영시설 및 기관')}</p>
        <h3>${escapeHTML(p.name || '')}</h3>
        <p>${escapeHTML(p.description || '')}</p>
      </div>
      ${p.url ? `<a class="btn" href="${encodeURI(p.url)}" target="_blank" rel="noopener">${escapeHTML(p.url.replace(/^https?:\/\//,''))} 방문 →</a>` : ''}
    </div>
  `).join('')}</div>` : `<div class="empty-note">등록된 운영시설·기관이 없습니다.</div>`;
}

function renderCompanyList(list){
  if(!list.length) return `<div class="empty-note">등록된 협력문화기업이 없습니다.</div>`;
  return `<div class="card-grid">${list.map(c => {
    const color = hashColor(c.name || 'company');
    const media = c.image
      ? `<div class="cc-media" style="background-image:url('${encodeURI(c.image)}'); background-size:cover; background-position:center;"></div>`
      : `<div class="cc-media" style="background:linear-gradient(135deg, ${color}, ${color}cc);">${escapeHTML((c.name||'').slice(0,1))}</div>`;
    const inner = `
      ${media}
      <div class="cc-body">
        <span class="cc-tag">협력문화기업</span>
        <h3>${escapeHTML(c.name || '')}</h3>
        <p>${escapeHTML(c.description || '')}</p>
        ${c.url ? `<span class="cc-link">방문하기 ↗</span>` : ''}
      </div>
    `;
    return c.url
      ? `<a class="company-card" href="${encodeURI(c.url)}" target="_blank" rel="noopener">${inner}</a>`
      : `<div class="company-card">${inner}</div>`;
  }).join('')}</div>`;
}

function renderNetworkTabs(){
  const host = document.getElementById('indexTabs');
  host.innerHTML = NETWORK_TABS.map(t => {
    const count = (NETWORK_DATA[t.key] || []).length;
    return `
      <button type="button" class="index-tab ${t.key === ACTIVE_NET_TAB ? 'active' : ''}" data-tab="${t.key}" style="background:${t.color};">
        ${escapeHTML(t.label)} <span class="it-count">${count}</span>
      </button>
    `;
  }).join('');
  host.querySelectorAll('.index-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      ACTIVE_NET_TAB = btn.getAttribute('data-tab');
      renderNetworkTabs();
      renderNetworkPanel();
    });
  });
}

function renderNetworkPanel(){
  const panel = document.getElementById('indexPanel');
  const tab = NETWORK_TABS.find(t => t.key === ACTIVE_NET_TAB);
  panel.style.borderTopColor = tab.color;
  const list = NETWORK_DATA[ACTIVE_NET_TAB] || [];
  panel.innerHTML = ACTIVE_NET_TAB === 'facility' ? renderFacilityList(list) : renderCompanyList(list);
}

document.addEventListener('DOMContentLoaded', async () => {
  const data = await loadJSON('/content/data/network.json');
  NETWORK_DATA = { facility: (data && data.facility) || [], company: (data && data.company) || [] };
  const params = new URLSearchParams(window.location.search);
  const requested = params.get('tab');
  ACTIVE_NET_TAB = (requested && NETWORK_TABS.some(t => t.key === requested)) ? requested : 'facility';
  renderNetworkTabs();
  renderNetworkPanel();
});
</script>
</body>
</html>
