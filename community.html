<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커뮤니티 — 한국문화기획학교</title>
<meta name="description" content="살롱 낯선, 살롱 내일, 회원스터디 등 한국문화기획학교의 커뮤니티를 소개합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/style.css">
<style>
  .community-card{
    border:1px solid var(--line); border-radius:14px; padding:26px 28px;
    background:#fff; display:flex; flex-direction:column; gap:8px;
  }
  .community-card .badge{
    display:inline-block; font-family:var(--mono); font-size:.68rem; letter-spacing:.05em;
    color:var(--forest); border:1px solid var(--forest); border-radius:999px; padding:3px 10px; width:fit-content;
  }
  .archive-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  @media (max-width:760px){ .archive-grid{ grid-template-columns:1fr; } }
  .archive-card{ border:1px solid var(--line); border-radius:12px; padding:18px 20px; background:#fff; }
  .archive-card .a-date{ font-family:var(--mono); font-size:.72rem; color:var(--stamp-deep); }
  .archive-card h3{ font-size:1rem; margin:6px 0 8px; line-height:1.4; }
  .archive-card summary{ cursor:pointer; font-size:.86rem; color:var(--ink-soft); margin-top:6px; }
  .archive-card .a-body{ margin-top:10px; font-size:.86rem; color:var(--ink-soft); border-top:1px dashed var(--line-strong); padding-top:10px; }
  .archive-card .a-body p{ margin:0 0 8px; white-space:pre-line; }
  .archive-card .a-speaker{ white-space:pre-line; }
  .archive-card .a-loc{ font-family:var(--mono); font-size:.72rem; margin-top:8px; color:var(--ink-soft); }
  #archiveSearch{ width:100%; max-width:320px; padding:10px 14px; border:1px solid var(--line-strong); border-radius:8px; font-size:.9rem; margin-bottom:20px; }
</style>
</head>
<body data-page="community">

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero ambient">
    <div class="page-hero-ambient-bg" aria-hidden="true"><span class="blob-1"></span><span class="blob-2"></span></div>
    <div class="wrap">
      <p class="eyebrow">커뮤니티</p>
      <h1>배우고, 나누고, 연결됩니다</h1>
      <p class="lede">한국문화기획학교는 정보를 전달하는 곳을 넘어, 문화기획자들이 실제로 만나고 네트워킹하는 커뮤니티입니다.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div id="communityList" style="display:flex; flex-direction:column; gap:18px;">
        <p>불러오는 중입니다…</p>
      </div>
    </div>
  </section>

  <section class="section alt" id="salon-archive">
    <div class="wrap">
      <div class="section-head" style="margin-bottom:20px;">
        <p class="eyebrow">살롱, 낯선 아카이브</p>
        <h2>2014년부터 지금까지, 모든 회차</h2>
        <p>최신 회차부터 순서대로 보여드립니다. 제목을 눌러 상세 내용을 펼쳐보세요.</p>
      </div>
      <input type="text" id="archiveSearch" placeholder="주제, 강연자로 검색">
      <div id="archiveGrid" class="archive-grid">
        <p>불러오는 중입니다…</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const communityData = await loadJSON('/content/data/community.json');
  const communityHost = document.getElementById('communityList');
  const items = (communityData && communityData.items) || [];
  communityHost.innerHTML = items.length ? items.map(c => `
    <div class="community-card">
      ${c.badge ? `<span class="badge">${escapeHTML(c.badge)}</span>` : ''}
      <h3 style="margin:4px 0 0;">${escapeHTML(c.name||'')}</h3>
      ${c.tagline ? `<p style="font-size:.86rem; color:var(--ink-soft); margin:0;">${escapeHTML(c.tagline)}</p>` : ''}
      <p style="margin:6px 0 0;">${escapeHTML(c.description||'')}</p>
      ${c.hasArchive ? `<a href="#salon-archive" style="margin-top:8px; font-weight:600; color:var(--forest);">아카이브 전체 보기 ↓</a>` : ''}
    </div>
  `).join('') : `<div class="empty-note">아직 등록된 커뮤니티가 없습니다.</div>`;

  const archiveData = await loadJSON('/content/data/salon-archive.json');
  const archiveHost = document.getElementById('archiveGrid');
  const searchInput = document.getElementById('archiveSearch');
  const entries = ((archiveData && archiveData.items) || []).slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));

  function renderArchive(list){
    if(!list.length){
      archiveHost.innerHTML = `<div class="empty-note">검색 결과가 없습니다.</div>`;
      return;
    }
    archiveHost.innerHTML = list.map(e => `
      <details class="archive-card">
        <summary>
          <span class="a-date">${escapeHTML(e.date||'')}</span>
          <h3 style="display:inline; font-size:.98rem;">${escapeHTML((e.title||'').replace(/[""]/g,''))}</h3>
        </summary>
        <div class="a-body">
          ${e.desc ? `<p>${escapeHTML(e.desc)}</p>` : ''}
          ${e.speaker ? `<p class="a-speaker">${escapeHTML(e.speaker)}</p>` : ''}
          ${e.location ? `<div class="a-loc">${escapeHTML(e.location)}</div>` : ''}
        </div>
      </details>
    `).join('');
  }
  renderArchive(entries);

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if(!q){ renderArchive(entries); return; }
    renderArchive(entries.filter(e =>
      (e.title||'').toLowerCase().includes(q) ||
      (e.speaker||'').toLowerCase().includes(q) ||
      (e.desc||'').toLowerCase().includes(q)
    ));
  });
});
</script>
</body>
</html>
